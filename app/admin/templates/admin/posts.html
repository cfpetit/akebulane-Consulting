{% extends "base_template.html" %}

{% block title %}Posts{% endblock %}

{% block content %}

<div class="admin-container">

    <div class="admin-header">

        <h1>Posts</h1>

        <a href="{{ url_for('admin.post_form') }}" class="btn-primary">
            + New Post
        </a>

    </div>

    <div class="admin-list">

        {% for post in posts %}

        <a class="admin-item"
           href="{{ url_for('admin.update_post_form', post_id=post.id) }}">

            {{ post.title }}

        </a>

        {% endfor %}

    </div>

</div>

{% endblock %}
