{% extends "base_template.html" %}

{% block title %}Bad Request (400){% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/errors.css') }}">

<section class="error-container">
    <div class="error-card">
        <div class="error-code error-code-400">400</div>
        <h1 class="error-title">Bad Request</h1>
        <p class="error-message">
            {{ reason }}
        </p>
        <div class="error-actions">
            <a href="{{ url_for('public.index') }}" class="btn-error-primary">
                Return to Home
            </a>
            <button onclick="window.history.back();" class="btn-error-secondary">
                Go Back & Retry
            </button>
        </div>
    </div>
</section>
{% endblock %}
