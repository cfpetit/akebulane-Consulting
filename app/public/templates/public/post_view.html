{% extends "base_template.html" %}

{% block title %}{{ post.title  }}{% endblock %}

{% block content %}
	<h1>{{ post.title }}</h1>
        {% if post.image_name %}
            <div>
                <img src="{{ url_for('media_posts', filename=post.image_name) }}" />
            </div>
        {% endif %}
	{{ post.content }}
{% endblock %}
